<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GolfJG 앱 받기</title>
<meta name="description" content="동반자와 내기 걸고, 워치로 찍고, 정산은 자동으로. GolfJG 골프 스코어·내기 정산 앱">
<meta property="og:title" content="GolfJG — 골프 내기 정산 앱">
<meta property="og:description" content="동반자와 내기 걸고, 워치로 찍고, 정산은 자동으로">
<meta property="og:type" content="website">
<style>
  :root { --green: #1B6B3A; --bg: #ffffff; --text: #1c1b1f; --sub: #5f6368; --card: #f3f7f4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #eee; --sub: #aaa; --card: #1d2620; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--green); color: #fff; padding: 48px 20px 40px; text-align: center; }
  header h1 { margin: 0 0 8px; font-size: 2rem; }
  header p { margin: 0; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  .store { display: block; text-align: center; text-decoration: none; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 1.05rem; margin: 12px 0; }
  .store.ready { background: var(--green); color: #fff; }
  .store.soon { background: var(--card); color: var(--sub); pointer-events: none; }
  .mine { outline: 3px solid #E6B93C; }
  ul { padding-left: 20px; line-height: 1.8; }
  .card { background: var(--card); border-radius: 16px; padding: 16px 18px; margin-top: 20px; }
  footer { text-align: center; color: var(--sub); font-size: .85rem; padding: 20px; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<header>
  <h1>⛳ GolfJG</h1>
  <p>동반자와 내기 걸고, 워치로 찍고, 정산은 자동으로</p>
</header>
<main>
  <a id="android" class="store" href="#">Google Play에서 받기</a>
  <a id="ios" class="store" href="#">App Store에서 받기</a>
  <p id="note" style="color: var(--sub); text-align: center; font-size: .9rem;"></p>

  <div class="card">
    <strong>이런 걸 해 줘요</strong>
    <ul>
      <li>타당·스킨스·배판·양파·개평까지 홀마다 자동 정산</li>
      <li>누가 누구에게 얼마 보내면 되는지 최소 건수로</li>
      <li>갤럭시워치·Apple Watch에서 탭으로 스코어 입력</li>
      <li>동반자 폰끼리 연동해서 각자 입력 (인터넷 없이)</li>
      <li>결과를 카톡으로 한 번에 공유</li>
    </ul>
  </div>
</main>
<footer>
  <a href="../">개인정보처리방침</a>
</footer>
<script>
  // 스토어 주소가 정해지면 여기만 바꾸면 됩니다 (빈 값이면 "출시 준비 중")
  const PLAY_URL = "";      // 예: https://play.google.com/store/apps/details?id=com.golfjg
  const APPSTORE_URL = "";  // 예: https://apps.apple.com/kr/app/golfjg/id0000000000

  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function setup(id, url, label) {
    const a = document.getElementById(id);
    if (url) { a.href = url; a.classList.add("ready"); a.textContent = label; }
    else { a.classList.add("soon"); a.textContent = label.replace("에서 받기", "") + " · 출시 준비 중"; }
    return a;
  }
  const android = setup("android", PLAY_URL, "Google Play에서 받기");
  const ios = setup("ios", APPSTORE_URL, "App Store에서 받기");
  if (isAndroid) android.classList.add("mine");
  if (isIOS) ios.classList.add("mine");

  // 내 폰에 맞는 스토어가 열려 있으면 바로 이동
  const target = isAndroid ? PLAY_URL : isIOS ? APPSTORE_URL : "";
  if (target) location.replace(target);
  else if (!PLAY_URL && !APPSTORE_URL) document.getElementById("note").textContent = "곧 출시됩니다. 조금만 기다려 주세요!";
</script>
</body>
</html>
